<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}whoop-lab{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#fafafa; --card:#ffffff; --muted:#6b6b76; --ok:#1a7f37; --bad:#b42318; --line:#d9d9e0; --accent:#2f5bd8; --accent-fg:#ffffff; --treat:#8a4b00; --treat-bg:#fff1d6; --ctrl:#274c8f; --ctrl-bg:#e4ecfb; }
    @media (prefers-color-scheme: dark) { :root { --fg:#ececf1; --bg:#131316; --card:#1c1c21; --muted:#9a9aa6; --ok:#4ac26b; --bad:#f97066; --line:#2c2c33; --accent:#7d9cf5; --accent-fg:#10131c; --treat:#ffcf80; --treat-bg:#3a2a0c; --ctrl:#a9c2f7; --ctrl-bg:#18243d; } }
    * { box-sizing:border-box; }
    body { margin:0; padding:12px 16px 40px; font:17px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
    main { max-width:34rem; margin:0 auto; }
    nav { max-width:34rem; margin:0 auto 14px; display:flex; gap:16px; flex-wrap:wrap; font-size:.95rem; }
    nav a { color:var(--muted); text-decoration:none; padding:6px 0; }
    nav a.here { color:var(--fg); font-weight:600; }
    h1 { font-size:1.3rem; margin:.2rem 0 1rem; }
    h2 { font-size:1rem; margin:1.6rem 0 .4rem; color:var(--muted); font-weight:600; }
    a { color:var(--accent); }
    a.button, button { display:inline-block; min-height:48px; padding:.7rem 1.1rem; border:1px solid var(--line); border-radius:.6rem; font:inherit; color:var(--fg); background:var(--card); text-decoration:none; cursor:pointer; }
    button.primary, a.button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
    button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
    button.danger { color:var(--bad); }
    input, textarea, select { width:100%; min-height:48px; padding:.6rem .7rem; font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:.6rem; }
    label { display:block; margin:.8rem 0 .25rem; font-size:.95rem; color:var(--muted); }
    form.inline { display:inline; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:14px 16px; margin:.6rem 0; }
    .arm { border-radius:.8rem; padding:16px; margin:.6rem 0; }
    .arm .label { font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
    .arm .what { font-size:1.25rem; font-weight:600; margin-top:.2rem; }
    .arm.treatment { background:var(--treat-bg); color:var(--treat); }
    .arm.control { background:var(--ctrl-bg); color:var(--ctrl); }
    dl { display:grid; grid-template-columns:auto 1fr; gap:.35rem 1rem; margin:1rem 0; }
    dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); } .small { font-size:.9rem; }
    .scroll { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:.95rem; } th, td { text-align:left; padding:.35rem .6rem .35rem 0; border-bottom:1px solid var(--line); white-space:nowrap; }
    pre { overflow-x:auto; font-size:.85rem; background:var(--card); border:1px solid var(--line); border-radius:.6rem; padding:10px; }
  </style>
  {% block scripts %}<script src="/static/htmx.min.js" defer></script>{% endblock %}
</head>
<body hx-boost="true">
{% block nav %}
{% set here = request.url.path %}
<nav>
  <a href="{{ request.app.state.settings.grafana_home }}" hx-boost="false">Health</a>
  <a href="/today" class="{{ 'here' if here.startswith('/today') }}">Today</a>
  <a href="/experiments" class="{{ 'here' if here.startswith('/experiments') }}">Experiments</a>
  <a href="/status" class="{{ 'here' if here.startswith('/status') }}">Status</a>
</nav>
{% endblock %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
