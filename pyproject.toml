[project]
name = "whoop-lab"
version = "0.1.0"
description = "Self-hosted WHOOP archive and n-of-1 experiment runner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2",
    "statsmodels>=0.15.0",
    "typer>=0.29.1",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
whoop-lab = "whoop_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", "src/whoop_lab/whoop/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "DTZ", "PT"]
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]
"alembic/**" = ["S608"]
"scripts/gen_dashboards.py" = ["E501"]
"src/whoop_lab/setup_db.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["whoop_lab.whoop.generated"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.94.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
