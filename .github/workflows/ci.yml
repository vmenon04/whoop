name: ci

# Every push and pull request is checked and both images are built. A version tag
# (v0.2.0), once the checks pass, publishes ghcr.io/vmenon04/whoop:0.2.0 and
# ghcr.io/vmenon04/whoop-grafana:0.2.0, the versions vmenon04/homelab deploys.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # testcontainers starts Postgres 16 in the runner's Docker.
      - run: uv run pytest
      - name: The dashboards are generated from the script
        run: |
          uv run python scripts/gen_dashboards.py
          git diff --exit-code grafana/dashboards

  secrets:
    # Every commit, not just the newest: a secret removed later is still in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No secrets in the history (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --no-banner --redact --verbose

  images:
    needs: [check, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP: ghcr.io/${{ github.repository }}
      GRAFANA: ghcr.io/${{ github.repository }}-grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build --tag "$APP:test" .
          docker build --tag "$GRAFANA:test" grafana
      - name: They run
        run: |
          docker run --rm "$APP:test" whoop-lab --help
          docker run --rm "$APP:test" alembic --help
          docker run --rm --entrypoint grafana "$GRAFANA:test" --version
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! grep -qx "version = \"$version\"" pyproject.toml; then
            echo "::error::$GITHUB_REF_NAME doesn't match the version in pyproject.toml"
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in "$APP" "$GRAFANA"; do
            docker tag "$image:test" "$image:$version"
            docker push "$image:$version"
          done
