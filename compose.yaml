name: whoop-lab

x-app: &app
  image: whoop-lab:local
  restart: unless-stopped
  environment: &app-env
    # Passed as parts, not as one URL, so the password may contain any character.
    POSTGRES_HOST: db
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID}
    WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://whoop.vasumenon.com}
    LOCAL_TIMEZONE: ${LOCAL_TIMEZONE:-America/New_York}
    NTFY_URL: ${NTFY_URL:-}
    NTFY_TOKEN: ${NTFY_TOKEN:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    # The one service that builds the image. api and worker start after it and reuse
    # the result; three parallel builds of the same tag can collide.
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback only. The tunnel is the only way in from outside.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "whoop_lab.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-12.0.0}
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-https://whoop.vasumenon.com}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: only if this stack should run its own tunnel connector.
  cloudflared:
    profiles: ["cloudflared"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

  # Optional: self-hosted ntfy. Otherwise point NTFY_URL at ntfy.sh with a private topic.
  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ntfy:/var/cache/ntfy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  grafana:
  ntfy:
